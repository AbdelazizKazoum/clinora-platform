name: clinora-backend

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: clinora_local_root_password
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -pclinora_local_root_password --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - clinora-backend

  auth-service:
    build:
      context: ../..
      dockerfile: apps/backend/services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      GRPC_PORT: 5001
      AUTH_PROTO_PATH: /workspace/libs/contracts/auth/src/lib/auth.proto
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: clinora_auth
      DB_PASSWORD: clinora_auth_local_password
      DB_NAME: clinora_auth
      DB_MIGRATIONS_RUN: "true"
      JWT_SECRET: local-access-secret-change-before-production-123456
      JWT_EXPIRES_IN: 900
      REFRESH_TOKEN_SECRET: local-refresh-secret-change-before-production-1234
      REFRESH_TOKEN_EXPIRES_IN: 604800
    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:5001:5001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3002/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinora-backend

  patient-service:
    build:
      context: ../..
      dockerfile: apps/backend/services/patient-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      GRPC_PORT: 5003
      PATIENT_PROTO_PATH: /workspace/libs/contracts/patient/src/lib/patient.proto
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: clinora_patient
      DB_PASSWORD: clinora_patient_local_password
      DB_NAME: clinora_patient
      DB_MIGRATIONS_RUN: "true"
    ports:
      - "127.0.0.1:3004:3004"
      - "127.0.0.1:5003:5003"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3004/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinora-backend

  clinic-service:
    build:
      context: ../..
      dockerfile: apps/backend/services/clinic-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      GRPC_PORT: 5002
      AUTH_PROTO_PATH: /workspace/libs/contracts/auth/src/lib/auth.proto
      CLINIC_PROTO_PATH: /workspace/libs/contracts/clinic/src/lib/clinic.proto
      AUTH_SERVICE_GRPC_URL: auth-service:5001
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: clinora_clinic
      DB_PASSWORD: clinora_clinic_local_password
      DB_NAME: clinora_clinic
      DB_MIGRATIONS_RUN: "true"
    ports:
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:5002:5002"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3003/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - clinora-backend

  api-gateway:
    build:
      context: ../..
      dockerfile: apps/backend/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      PORT: 3001
      AUTH_PROTO_PATH: /workspace/libs/contracts/auth/src/lib/auth.proto
      PATIENT_PROTO_PATH: /workspace/libs/contracts/patient/src/lib/patient.proto
      AUTH_SERVICE_GRPC_URL: auth-service:5001
      PATIENT_SERVICE_GRPC_URL: patient-service:5003
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
    networks:
      - clinora-backend

networks:
  clinora-backend:
    driver: bridge

volumes:
  db_data:
