syntax = "proto3";

package clinic;

service ClinicService {
  rpc GetClinic (ClinicIdRequest) returns (ClinicReply);
  rpc CreateClinic (CreateClinicRequest) returns (ClinicReply);
  rpc GetWorkingHours (ClinicIdRequest) returns (WorkingHoursListReply);
  rpc UpsertWorkingHours (UpsertWorkingHoursRequest)
    returns (WorkingHoursListReply);
  rpc GetStaffMember (GetStaffMemberRequest) returns (StaffMemberReply);
  rpc ListStaffMembers (ListStaffMembersRequest) returns (StaffMembersReply);
  rpc CreateStaffMember (CreateStaffMemberRequest) returns (StaffMemberReply);
  rpc UpdateStaffMember (UpdateStaffMemberRequest) returns (StaffMemberReply);
  rpc DeleteStaffMember (DeleteStaffMemberRequest) returns (SuccessReply);
}

message ClinicIdRequest {
  string clinic_id = 1;
}

message ClinicReply {
  string id = 1;
  string slug = 2;
  string name = 3;
  string phone = 4;
  string email = 5;
  string address = 6;
  string timezone = 7;
  string locale = 8;
  bool is_active = 9;
  string created_at = 10;
  string updated_at = 11;
}

message CreateClinicRequest {
  string slug = 1;
  string name = 2;
  optional string phone = 3;
  optional string email = 4;
  optional string address = 5;
  optional string timezone = 6;
  optional string locale = 7;
}

message WorkingHoursEntry {
  string id = 1;
  string clinic_id = 2;
  int32 day_of_week = 3;
  string open_time = 4;
  string close_time = 5;
  bool is_closed = 6;
}

message WorkingHoursListReply {
  repeated WorkingHoursEntry entries = 1;
}

message UpsertWorkingHoursEntry {
  int32 day_of_week = 1;
  optional string open_time = 2;
  optional string close_time = 3;
  bool is_closed = 4;
}

message UpsertWorkingHoursRequest {
  string clinic_id = 1;
  repeated UpsertWorkingHoursEntry entries = 2;
}

message StaffMemberReply {
  string id = 1;
  string clinic_id = 2;
  string user_id = 3;
  string role = 4;
  string status = 5;
  string first_name = 6;
  string last_name = 7;
  string phone = 8;
  string email = 9;
  string specialization = 10;
  string avatar = 11;
  bool is_active = 12;
  string created_at = 13;
  string updated_at = 14;
}

message GetStaffMemberRequest {
  string clinic_id = 1;
  string user_id = 2;
}

message ListStaffMembersRequest {
  string clinic_id = 1;
}

message StaffMembersReply {
  repeated StaffMemberReply items = 1;
}

message CreateStaffMemberRequest {
  string clinic_id = 1;
  string role = 2;
  string first_name = 3;
  string last_name = 4;
  optional string phone = 5;
  string email = 6;
  optional string specialization = 7;
  optional string avatar = 8;
  string password = 9;
}

message UpdateStaffMemberRequest {
  reserved 11;
  string clinic_id = 1;
  string staff_member_id = 2;
  optional string role = 3;
  optional string status = 4;
  optional string first_name = 5;
  optional string last_name = 6;
  optional string phone = 7;
  optional string email = 8;
  optional string specialization = 9;
  optional string avatar = 10;
}

message DeleteStaffMemberRequest {
  string clinic_id = 1;
  string staff_member_id = 2;
}

message SuccessReply {
  bool success = 1;
}
